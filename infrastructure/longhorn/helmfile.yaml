repositories:
  - name: longhorn
    url: https://charts.longhorn.io

releases:
  - name: longhorn
    namespace: longhorn-system
    createNamespace: false
    chart: longhorn/longhorn
    version: "1.9.x"
    wait: true
    values:
      - longhornUI:
          replicas: 1
      - service:
          ui:
            type: LoadBalancer
            loadBalancerIP: 192.168.0.249
      - defaultSettings:
          defaultDataPath: "/data/hogwarts-kitchen/storage"
          # When a node goes down, force-delete its stuck pods so Longhorn can
          # detach the volumes and reattach them elsewhere. Without this a
          # StatefulSet never recovers on its own: Kubernetes won't recreate the
          # ordinal while the original pod is Terminating on an unreachable node.
          nodeDownPodDeletionPolicy: "delete-both-statefulset-and-deployment-pod"
      - persistence:
          defaultClass: "longhorn-sc"
      - preUpgradeChecker:
          jobEnabled: false
    hooks:
      - events: ["prepare"]
        showlogs: true
        command: kubectl
        args: ["apply", "-f", "namespace.yaml"]
      - events: ["prepare"]
        showlogs: true
        command: kubectl
        args: ["apply", "-f", "storage-classes.yaml"]
